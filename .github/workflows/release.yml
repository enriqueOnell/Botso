name: Generar y Publicar APK (Release)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Ensamblar APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio de Botso
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      # 1. Compilamos la versión de Producción (Saldrá "sin firmar")
      - name: Ensamblar APK (Release)
        run: ./gradlew assembleRelease

      # 2. El robot que sella la app usando tus secretos de GitHub
      - name: Firmar APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app # Le ponemos un ID para referenciarlo en el siguiente paso
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0" # Usa las herramientas modernas de Android

      # NUEVO PASO: Renombrar el archivo feo por uno bonito
      - name: Renombrar APK
        run: mv ${{steps.sign_app.outputs.signedReleaseFile}} Botso-${{ github.ref_name }}.apk

      # 3. Publicar la Release con el APK ya firmado
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: Botso ${{ github.ref_name }}
          files: Botso-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}